name: Rust

on:
  [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        host_os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.host_os }}

    steps:
    - uses: actions/checkout@v3
    - name: check
      run: cargo check
    - name: rustfmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy -- -D warnings
    - name: Build
      run: cargo build --verbose --all-features --tests --examples
    - name: Run tests
      run: cargo test --verbose

  apple-cross:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-apple-tvos
          - aarch64-apple-tvos-sim

    steps:
    - uses: actions/checkout@v3
    - name: Install target
      run: rustup target add ${{ matrix.target }}
    # `cargo check` still runs build.rs, which is where all the Apple SDK
    # detection and bindgen wiring lives.
    - name: Check
      run: cargo check --target ${{ matrix.target }} -vv
